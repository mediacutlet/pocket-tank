# The over-the-air release (docs/OTA.md): on a version tag, build the firmware
# for every board (docs/BOARDS.md) SIGNED with the project's key, make each
# board's OTA manifest, and attach the images and the manifests to the GitHub
# Release for that tag. A tank fetches its own board's
#   https://github.com/mediacutlet/pocket-tank/releases/latest/download/latest-<board>.json
# (amoled18, round175c, watch206, square216: common/version.h PT_BOARD)
# so a release is live for every tank the moment it is published - and a
# PRE-RELEASE is skipped by "latest": the private test channel (the
# director's `ota url` points a tank at a pre-release's own asset URL).
#
# The signing key is the repository secret OTA_SIGNING_KEY (the PEM text of
# firmware/keys/ota_signing_key.pem; tools/ota_key.sh). It never appears in
# a log. Fork PRs do not see secrets and this workflow does not run for them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # one job per board (docs/BOARDS.md), in parallel: the same tree on top of
  # each board's sdkconfig fragment, each in its own build dir
  firmware:
    name: firmware (${{ matrix.name }})
    if: github.repository == 'mediacutlet/pocket-tank'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: "the 1.8", board: amoled18, dir: build, command: "idf.py build" }
          - { name: "the round board (1.75C)", board: round175c, dir: build-round, command: "idf.py -B build-round -DSDKCONFIG=build-round/sdkconfig \"-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.round\" build" }
          - { name: "the watch (2.06)", board: watch206, dir: build-watch, command: "idf.py -B build-watch -DSDKCONFIG=build-watch/sdkconfig \"-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.watch\" build" }
          - { name: "the square (2.16)", board: square216, dir: build-square, command: "idf.py -B build-square -DSDKCONFIG=build-square/sdkconfig \"-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.square\" build" }
    env:
      IDF_VERSION: v5.4.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # git describe wants the tags
      - name: Signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          test -n "$OTA_SIGNING_KEY" || { echo "no OTA_SIGNING_KEY secret"; exit 1; }
          mkdir -p firmware/keys
          printf '%s\n' "$OTA_SIGNING_KEY" > firmware/keys/ota_signing_key.pem
      # restore only: a tag run reuses main's ccache (installer.yml saves it) and never writes its own
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.board }}-idf-${{ env.IDF_VERSION }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.board }}-idf-${{ env.IDF_VERSION }}-
      - name: Build (signed) - ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware
          extra_docker_args: -e IDF_CCACHE_ENABLE=1 -e CCACHE_DIR=/app/${{ github.repository }}/.ccache -e CCACHE_MAXSIZE=400M
          command: ccache -z && ${{ matrix.command }} && ccache -s
      - name: Drop the signing key
        if: always()
        run: rm -f firmware/keys/ota_signing_key.pem
      # only what tools/make_ota_manifest.py reads: the signed pocket_tank.bin (+ the rest of the flash set)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          if-no-files-found: error
          retention-days: 1
          path: |
            firmware/${{ matrix.dir }}/flasher_args.json
            firmware/${{ matrix.dir }}/*.bin
            firmware/${{ matrix.dir }}/bootloader/bootloader.bin
            firmware/${{ matrix.dir }}/partition_table/partition-table.bin

  ota:
    needs: firmware
    if: github.repository == 'mediacutlet/pocket-tank'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # git describe wants the tags; the tag's message is the manifest note
      # checkout leaves the pushed tag as a plain ref to its commit: fetch the
      # annotated tag itself, or the note below is the commit's message
      - name: The tag's own message
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          pattern: build*
          path: firmware        # each board's artifact lands in firmware/<its build dir>
      - name: OTA image + manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          for B in firmware/build firmware/build-round firmware/build-watch firmware/build-square; do   # the board comes from each image's marker
            python3 tools/make_ota_manifest.py --build-dir "$B" \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" --out ota
          done
          ls -la ota
          test "$(ls ota/latest-*.json | wc -l)" -eq 4 || { echo "expected four board manifests"; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # a tag with a suffix (v0.3.0-rc1) is a pre-release: invisible to "latest"
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ota/latest-*.json ota/pocket_tank-*.bin --clobber
          else
            gh release create "$TAG" ota/latest-*.json ota/pocket_tank-*.bin $PRE --verify-tag \
              --title "$TAG" --notes "$(git tag -l --format='%(contents)' "$TAG")"
          fi
